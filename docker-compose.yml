# Docker Compose for a Sitbaby dev environment: Postgres + the Next.js app.
#
#   docker compose up --build        # start (app on http://localhost:3000)
#   docker compose down              # stop
#   docker compose down -v           # stop and wipe the database volume
#
# On first boot with an empty DB, set SEED_ON_START=true to load demo accounts
# (see README / docs/sitbaby-agency-model-notes.md).
#
# Values below use ${VAR:-default} so you can override via a shell env or an
# .env file next to this compose file, but they run out-of-the-box as-is.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sitbaby}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sitbaby}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Prisma connection (points at the db service on the compose network).
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sitbaby}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sitbaby}?schema=public
      # Auth — CHANGE NEXTAUTH_SECRET for anything beyond local dev.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Seed demo data on first boot of a fresh DB.
      SEED_ON_START: ${SEED_ON_START:-true}
      # Business-rule defaults (also editable at runtime via /admin/settings).
      LAST_MINUTE_THRESHOLD_HOURS: ${LAST_MINUTE_THRESHOLD_HOURS:-12}
      RUSH_FEE_TYPE: ${RUSH_FEE_TYPE:-PERCENT}
      RUSH_FEE_AMOUNT: ${RUSH_FEE_AMOUNT:-25}
      PLATFORM_FEE_TYPE: ${PLATFORM_FEE_TYPE:-PERCENT}
      PLATFORM_FEE_AMOUNT: ${PLATFORM_FEE_AMOUNT:-15}
      # Stripe is optional — leave unset to run in mock payment mode.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
